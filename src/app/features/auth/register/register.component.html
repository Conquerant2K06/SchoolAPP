<div class="auth-container">
  <div class="auth-card">
    <h1>Créer un compte</h1>
    <p class="subtitle">Rejoignez SchoolCI</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Nom complet</label>
        <input type="text" formControlName="displayName" placeholder="Aya Traoré" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="votre@email.ci" />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Rôle</label>
        <select formControlName="role">
          <option value="student">Élève</option>
          <option value="teacher">Enseignant</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>

      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Création...' : "S'inscrire" }}
      </button>
    </form>

    <p class="footer-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
