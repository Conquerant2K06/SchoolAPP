<div class="modal-backdrop" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ subject ? 'Modifier' : 'Nouvelle' }} matière</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field"><label>Nom *</label><input type="text" formControlName="name" /></div>
      <div class="field"><label>Coefficient *</label><input type="number" formControlName="coefficient" min="1" /></div>
      @if (error()) { <div class="alert-error">{{ error() }}</div> }
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">{{ saving() ? '...' : 'Enregistrer' }}</button>
      </div>
    </form>
  </div>
</div>
