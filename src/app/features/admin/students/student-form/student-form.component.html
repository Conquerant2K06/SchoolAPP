<div class="modal-backdrop" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ student ? 'Modifier' : 'Nouvel' }} élève</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Prénom *</label>
        <input type="text" formControlName="first_name" />
      </div>
      <div class="field">
        <label>Nom *</label>
        <input type="text" formControlName="last_name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" />
      </div>
      <div class="field">
        <label>ID Classe</label>
        <input type="number" formControlName="class_id" placeholder="(optionnel)" />
      </div>

      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
